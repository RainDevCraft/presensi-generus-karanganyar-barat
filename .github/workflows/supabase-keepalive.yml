name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 1 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase keep_alive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: Secret SUPABASE_URL atau SUPABASE_ANON_KEY belum diisi."
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}"
          STATUS=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
            -X POST "${BASE_URL}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP Status: ${STATUS}"
          cat /tmp/response.txt
          echo ""

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Keep-alive ping gagal dengan HTTP ${STATUS}"
            exit 1
          fi
